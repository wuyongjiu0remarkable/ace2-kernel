name: build-sm8475

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "baseline | thermal | root | full"
        type: choice
        default: root
        options: [baseline, thermal, root, full]
      capacity_mah:
        description: "battery capacity mAh (empty = skip)"
        default: ""
      cell_max_mv:
        description: "cell max voltage mV"
        default: ""
      vfloat_mv:
        description: "normal cutoff mV (empty = keep stock)"
        default: ""

env:
  BRANCH: oneplus/sm8475_b_16.0.0_ace_2
  WORK: ${{ github.workspace }}/work

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev cpio kmod python3 git rsync zip unzip lld llvm clang device-tree-compiler lz4 zstd xz-utils patch

      - name: Assemble source tree
        env:
          ASSEMBLE_ONLY: "1"
        run: bash scripts/build-gki.sh "$WORK"

      - name: Tune build configs
        run: |
          set -eux
          K="$WORK/kernel_platform"
          C1="$K/common/build.config.common"
          sed -i 's|^BUILDTOOLS_PREBUILT_BIN=.*|BUILDTOOLS_PREBUILT_BIN=|' "$C1"
          sed -i 's|^CLANG_PREBUILT_BIN=.*|CLANG_PREBUILT_BIN=|' "$C1"
          sed -i 's|^POST_DEFCONFIG_CMDS=.*|POST_DEFCONFIG_CMDS=|' "$K/common/build.config.gki"
          C3="$K/common/build.config.gki.aarch64"
          sed -i 's|^ABI_DEFINITION=.*|ABI_DEFINITION=|; s|^TIDY_ABI=.*|TIDY_ABI=0|' "$C3"
          sed -i 's|^KMI_SYMBOL_LIST=.*|KMI_SYMBOL_LIST=|; s|^KMI_ENFORCED=.*|KMI_ENFORCED=0|' "$C3"
          sed -i '/^ADDITIONAL_KMI_SYMBOL_LISTS=/,/^"$/d' "$C3"
          sed -i '/ADDITIONAL_KMI_SYMBOL_LISTS+=/d' "$C3"
          sed -i 's|^KMI_SYMBOL_LIST_STRICT_MODE=.*|KMI_SYMBOL_LIST_STRICT_MODE=0|' "$C3"
          grep -nE 'ABI_DEFINITION|TIDY_ABI|KMI_' "$C3" || true
          G="$K/common/arch/arm64/configs/gki_defconfig"
          sed -i 's/^CONFIG_LTO_CLANG/# &/' "$G"
          grep -q '^CONFIG_LTO_NONE=y' "$G" || echo 'CONFIG_LTO_NONE=y' >> "$G"
          WB="$K/build/build-tools/path/linux-x86"
          for t in bison flex m4 make python3 python awk sed; do
            s=$(command -v "$t" || true)
            if [ -n "$s" ]; then ln -sf "$s" "$WB/$t"; fi
          done
          ls -l "$WB/bison"

      - name: Apply thermal patch
        if: inputs.variant != 'baseline'
        run: bash scripts/apply-patches.sh "$WORK"

      - name: Integrate KernelSU + SUSFS
        if: inputs.variant == 'root' || inputs.variant == 'full'
        run: bash scripts/integrate-root.sh "$WORK/kernel_platform/common"

      - name: Apply battery profile
        if: inputs.capacity_mah != ''
        env:
          CAP: ${{ inputs.capacity_mah }}
          CELLMAX: ${{ inputs.cell_max_mv }}
          VFLOAT: ${{ inputs.vfloat_mv }}
        run: |
          set -euo pipefail
          DTSI="$WORK/kernel_platform/qcom/proprietary/devicetree/oplus/oplus_chg/oplus-chg-22803.dtsi"
          ARGS=(--dtsi "$DTSI" --capacity "$CAP" --write)
          if [ -n "$VFLOAT" ]; then
            ARGS+=(--vfloat-mv "$VFLOAT" --cell-max-mv "$CELLMAX")
          fi
          python3 scripts/apply-battery-profile.py "${ARGS[@]}"

      - name: Build
        env:
          HERMETIC_TOOLCHAIN: "0"
          JOBS: "4"
        run: bash scripts/build-gki.sh "$WORK"

      - name: Verify features
        if: always()
        run: |
          set -x
          CFG="$WORK/out/common/.config"
          grep -E '^CONFIG_KSU' "$CFG" || echo NO_KSU
          grep -E '^CONFIG_KSU_SUSFS' "$CFG" || echo NO_SUSFS
          ls -la "$WORK/out/common/arch/arm64/boot/" || true
          find "$WORK/out" -maxdepth 6 -name 'Image*' || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm8475-${{ inputs.variant }}-${{ github.run_number }}
          path: |
            work/out/dist/
            work/out/common/arch/arm64/boot/
            work/out/common/.config
            work/out/build.log
          if-no-files-found: warn
          retention-days: 14